{# The Loom mark: one story thread that branches. Size it with CSS (width/height). #}
<svg class="loom-logo" viewBox="0 0 72 72" role="img" aria-label="Loom logo" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="lg-thread" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f0cf86"/><stop offset="1" stop-color="#b9a6f5"/>
        </linearGradient>
    </defs>
    <g class="loom-logo__threads" fill="none" stroke="url(#lg-thread)" stroke-width="3" stroke-linecap="round">
        <path d="M13 36 C 26 36, 26 18, 40 18"/>
        <path d="M13 36 C 26 36, 26 54, 40 54"/>
        <path d="M40 18 C 50 18, 52 11, 60 11"/>
        <path d="M40 18 C 50 18, 52 27, 60 27"/>
    </g>
    <g class="loom-logo__nodes">
        <circle class="n n--root" cx="13" cy="36" r="7" fill="#d9a94e"/>
        <circle class="n" cx="40" cy="18" r="5.5" fill="#1b1a2e" stroke="#d9a94e" stroke-width="2.5"/>
        <circle class="n" cx="40" cy="54" r="5.5" fill="#1b1a2e" stroke="#b9a6f5" stroke-width="2.5"/>
        <circle class="n" cx="60" cy="11" r="4" fill="#b9a6f5"/>
        <circle class="n" cx="60" cy="27" r="4" fill="#d9a94e"/>
    </g>
</svg>
