{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings · Loom</title>
    <link rel="stylesheet" href="{% static 'css/shared/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}">
</head>
<body>
    <div class="page page--settings">
        <h1>Settings</h1>
        <form method="post">
            {% csrf_token %}
            <div class="field field--checkbox">
                <label>
                    <input type="checkbox" name="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
                    Dark mode
                </label>
            </div>
            <div class="field field--checkbox">
                <label>
                    <input type="checkbox" name="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
                    Email notifications
                </label>
            </div>
            <button type="submit">Save</button>
        </form>
        <hr class="stitch">
        <a href="{% url 'home:home' %}">Back to Home</a>
    </div>
</body>
</html>
